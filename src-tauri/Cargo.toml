[package]
name = "kakiwake-ai"
description = "Plain text / Markdown / AsciiDoc / Teams / Redmine Textile converter powered by LLM CLIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "kakiwake_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
kakiwake-core = { path = "../crates/kakiwake-core" }
tauri = { version = "2.12", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54", features = ["sync", "time", "macros"] }
